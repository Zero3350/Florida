name: Florida arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: install dependencies
        run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief graphlib
      - name: build frida-server (android-arm64)
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          git clone --recurse-submodules https://github.com/frida/frida
          cd frida
          for path in ../patches/*; do
            name=$(basename "$path")
            echo "Applying Florida patches to subprojects/$name"
            cd "subprojects/$name"
            git am ../../../patches/$name/*.patch
            cd ../..
          done
          cd ..
          mkdir build-android-arm64
          cd build-android-arm64
          ../frida/configure --host=android-arm64
          make
          cd ..
          cp build-android-arm64/subprojects/frida-core/server/frida-server ./florida-server-android-arm64
          ls -la ./florida-server-android-arm64
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-android-arm64
          path: florida-server-android-arm64
